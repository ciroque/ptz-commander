name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B out/build/ci -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build out/build/ci --config Release --target ptz_commander ptz_tests

      - name: Test
        run: ctest --test-dir out/build/ci -C Release --output-on-failure
