name: Release installer

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-msi:
    name: Build Windows MSI
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Configure
        run: cmake -S . -B out/build/x64-Release -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build out/build/x64-Release --config RelWithDebInfo --target ptz_commander

      - name: Build installer
        working-directory: installer
        shell: cmd
        run: build-installer.bat

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: PTZCommander-msi
          path: installer/build/PTZCommander.msi

      - name: Attach MSI to GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/build/PTZCommander.msi
          generate_release_notes: true
          fail_on_unmatched_files: true
