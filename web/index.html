<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PTZ Commander — scenes</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #12141a;
      --panel: #1c2028;
      --text: #e8eaed;
      --muted: #9aa3b2;
      --ok: #3dd68c;
      --bad: #ff6b6b;
      --accent: #6ea8fe;
      --border: #2c3340;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, Segoe UI, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 1.25rem 1.5rem 2rem;
    }
    h1 { font-size: 1.15rem; font-weight: 600; margin: 0 0 0.75rem; }
    .row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem 1rem;
      margin-bottom: 1rem;
    }
    #status {
      font-variant-numeric: tabular-nums;
    }
    #status.connected { color: var(--ok); }
    #status.disconnected { color: var(--bad); }
    button {
      background: var(--accent);
      color: #0b1220;
      border: 0;
      border-radius: 6px;
      padding: 0.4rem 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.08); }
    button:disabled { opacity: 0.45; cursor: not-allowed; filter: none; }
    #scenes {
      list-style: none;
      padding-left: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }
    #scenes button { font-weight: 600; }
    #last-apply { color: var(--muted); font-size: 0.85rem; }
    h2 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin: 1rem 0 0.4rem;
    }
    ul {
      margin: 0;
      padding-left: 1.2rem;
    }
    li { margin: 0.15rem 0; }
    .empty { color: var(--muted); font-style: italic; list-style: none; padding-left: 0; }
    pre {
      margin: 0;
      padding: 0.9rem 1rem;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: auto;
      font-size: 0.82rem;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <h1>PTZ Commander scenes</h1>
  <div class="row">
    <span id="status" class="disconnected">Disconnected</span>
    <button id="reconnect" type="button">Reconnect</button>
    <span style="color: var(--muted); font-size: 0.85rem;">ws://127.0.0.1:7420</span>
  </div>

  <h2>Scenes</h2>
  <ul id="scenes"><li class="empty">No message yet</li></ul>
  <p id="last-apply"></p>

  <h2>Setup JSON</h2>
  <pre id="dump">(waiting for connection)</pre>

  <script>
    const WS_URL = "ws://127.0.0.1:7420";
    const statusEl = document.getElementById("status");
    const dumpEl = document.getElementById("dump");
    const scenesEl = document.getElementById("scenes");
    const lastApplyEl = document.getElementById("last-apply");
    const reconnectBtn = document.getElementById("reconnect");

    let socket = null;
    let connected = false;

    function setStatus(isConnected) {
      connected = isConnected;
      statusEl.textContent = isConnected ? "Connected" : "Disconnected";
      statusEl.className = isConnected ? "connected" : "disconnected";
      scenesEl.querySelectorAll("button").forEach((btn) => {
        btn.disabled = !isConnected;
      });
    }

    function applyScene(name) {
      if (!socket || socket.readyState !== WebSocket.OPEN) {
        lastApplyEl.textContent = "Not connected";
        return;
      }
      socket.send(JSON.stringify({ op: "scene.apply", name }));
    }

    function renderScenes(data) {
      const names = Object.keys((data && data.scenes) || {});
      scenesEl.replaceChildren();
      if (names.length === 0) {
        const li = document.createElement("li");
        li.className = "empty";
        li.textContent = "(none)";
        scenesEl.appendChild(li);
        return;
      }
      names.forEach((name) => {
        const li = document.createElement("li");
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = name;
        btn.disabled = !connected;
        btn.addEventListener("click", () => applyScene(name));
        li.appendChild(btn);
        scenesEl.appendChild(li);
      });
    }

    function onMessage(event) {
      const raw = event.data;
      try {
        const data = JSON.parse(raw);
        if (data && typeof data === "object" && (data.op || data.ok !== undefined)) {
          if (data.ok) {
            lastApplyEl.textContent = "Applied " + data.name;
          } else {
            lastApplyEl.textContent = data.error || "Apply failed";
          }
          return;
        }
        dumpEl.textContent = JSON.stringify(data, null, 2);
        renderScenes(data);
      } catch (err) {
        dumpEl.textContent = String(raw);
        scenesEl.replaceChildren();
        const li = document.createElement("li");
        li.className = "empty";
        li.textContent = "(invalid JSON)";
        scenesEl.appendChild(li);
      }
    }

    function connect() {
      if (socket) {
        socket.onopen = null;
        socket.onclose = null;
        socket.onerror = null;
        socket.onmessage = null;
        try { socket.close(); } catch (_) {}
        socket = null;
      }

      setStatus(false);
      const ws = new WebSocket(WS_URL);
      socket = ws;

      ws.onopen = () => {
        if (socket === ws) setStatus(true);
      };
      ws.onclose = () => {
        if (socket === ws) {
          setStatus(false);
          socket = null;
        }
      };
      ws.onerror = () => {
        if (socket === ws) setStatus(false);
      };
      ws.onmessage = onMessage;
    }

    reconnectBtn.addEventListener("click", connect);
    connect();
  </script>
</body>
</html>
